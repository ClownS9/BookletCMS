title: Post
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              validate:
                - required
          -
            handle: content
            field:
              type: markdown
              display: Body
          -
            handle: blocks
            field:
              type: blocks
              display: Cut-outs
              instructions: 'Quotes, pictures, buttons and more, after the body.'
  sidebar:
    display: 'Margin notes'
    sections:
      -
        fields:
          -
            handle: excerpt
            field:
              type: textarea
              display: Standfirst
              instructions: 'A line under the title that sets up the story.'
          -
            handle: cover
            field:
              type: assets
              container: media
              max_files: 1
              display: 'Cover image'
          -
            handle: cover_caption
            field:
              type: text
              display: 'Cover caption'
              instructions: 'Caption and credit, shown under the picture.'
          -
            handle: categories
            field:
              type: terms
              taxonomies:
                - categories
              max_items: 1
              display: Category
          -
            handle: tags
            field:
              type: terms
              taxonomies:
                - tags
              display: Tags
          -
            import: seo
